# Release notes for each GitHub release (see .github/workflows/release.yml).
# Prefix commits with feat:/fix:/docs: to group them; anything else lands under "Other".
[changelog]
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | upper_first }}{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
# The <!-- n --> comments only order the sections; they're stripped from the output.
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Fixes" },
  { message = "^docs", group = "<!-- 2 -->Docs" },
  { message = ".*", group = "<!-- 3 -->Other" },
]
